# CI for the public marketplace repo.
#
# This repo is the canonical source for:
#   - `@btrmnt/artifact-types`  (shared TS types, consumed by artifact-platform
#                                api + the bin/btrmnt CLI)
#   - `bin/btrmnt`              (the CLI shipped to end users via Claude Code
#                                plugins)
#   - the marketplace + plugin manifests
#
# There is no deploy step: Claude Code auto-pulls the new commit SHA per
# plugin commit-SHA versioning. Merging to main IS the release. CI's only
# job is to make sure the SHA we expose to users actually builds + tests
# green.
#
# Triggers on PRs and on push-to-main (so the merge commit gets a green
# check before any user pulls it).

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run typecheck
      # Runs the 54+ vitest specs across the workspace (plugin smoke,
      # bin/btrmnt unit + integration, types build smoke).
      - run: pnpm -r --if-present run test

  plugin-validate:
    name: plugin manifests
    runs-on: ubuntu-latest
    # The `claude` CLI isn't available on GitHub-hosted runners and we
    # don't want to download + auth it just for syntax validation. Re-do
    # the JSON parse pass the smoke tests already cover, so a bad manifest
    # fails CI even if vitest is misconfigured. If we ever install the
    # `claude` CLI on the runner, swap this for `claude plugin validate .`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: parse plugin manifests
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/artifacts/.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/artifacts/hooks/hooks.json','utf8'))"

  verify-dist-fresh:
    name: verify plugin dist/ matches src/
    runs-on: ubuntu-latest
    # `dist/` for the plugin CLI is checked in (see .gitignore) because
    # Claude Code clones the marketplace repo verbatim on install and there
    # is no postinstall build step. This job enforces that whoever pushed
    # the change ran `pnpm --filter @btrmnt/artifacts-cli build` first.
    # If this fails, run the build locally and commit the updated dist/.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @btrmnt/artifacts-cli build
      - name: assert committed dist/ matches src/
        run: |
          set -euo pipefail
          git diff --exit-code -- plugins/artifacts/bin/dist/ \
            || (echo "::error::plugins/artifacts/bin/dist/ is stale — run \`pnpm --filter @btrmnt/artifacts-cli build\` locally and commit the result"; exit 1)

  build-types:
    name: build @btrmnt/artifact-types
    runs-on: ubuntu-latest
    # The types package is the cross-repo contract with artifact-platform.
    # We pin it as its own job so a typo in a type definition lights up
    # this exact check rather than being buried in the noisy `-r test`
    # output above.
    #
    # TODO (future): on push to a `types-v*` tag, publish the built package
    # to GitHub Package Registry. Not wired yet — see todo.md §Open
    # questions in artifact-platform.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @btrmnt/artifact-types build
      - name: assert dist files exist
        run: |
          set -euo pipefail
          test -f packages/types/dist/index.js
          test -f packages/types/dist/index.d.ts
